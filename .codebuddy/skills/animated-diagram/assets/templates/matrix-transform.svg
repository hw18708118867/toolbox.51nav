<!--
  模板：矩阵 / 网格变换式（可播放）
  适用：对同一组数据反复做变换的场景
        （如 AES 轮函数、图像卷积、FFT 蝶形、位运算置换）

  用法：
  1. 复制整个 <figure> 到 Markdown 正文
  2. 每个「阶段」放一个网格，阶段数 = data-steps 的步数
  3. 用 dg-cell-p 着色跟踪若干格子，让读者看到它们是怎么被搬动的
  4. 把 m9 改成全页唯一 id
  5. 调 viewBox 高度 = 内容底部 + 24
  约定：
  - 网格：4×4，格子 18px，外框 72×72，网格间距 148
  - 网格线用一个 <path class="dg-cell" d="M.. V.. M.. H.."/> 画完
  - 每列下方用 dg-tl 写步骤名、dg-tb + dg-ts 写状态说明
-->
<figure class="dg-figure" data-interval="2200" data-steps='[{"t":"初始状态","d":"数据按约定顺序填入网格。"},{"t":"第一步变换","d":"第一步做了什么，哪些格子被移动了。"},{"t":"第二步变换","d":"第二步做了什么。"},{"t":"输出结果","d":"变换后的状态，作为下一阶段的输入。"}]'>
<svg viewBox="0 0 820 200" role="img" aria-label="TODO：用一句话描述这张图" text-anchor="middle" dominant-baseline="central">
<defs><marker id="m9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" fill-opacity=".55"/></marker></defs>
<!-- 步骤 0：初始网格。追踪格：第 0 列竖排 4 格 -->
<g class="dg-pop" data-step="0">
<rect class="dg-cell" x="26" y="56" width="72" height="72" rx="3"/>
<rect class="dg-cell-p" x="26" y="56" width="18" height="18"/><rect class="dg-cell-p" x="26" y="74" width="18" height="18"/><rect class="dg-cell-p" x="26" y="92" width="18" height="18"/><rect class="dg-cell-p" x="26" y="110" width="18" height="18"/>
<path class="dg-cell" d="M44,56 V128 M62,56 V128 M80,56 V128 M26,74 H98 M26,92 H98 M26,110 H98"/>
<text class="dg-tb" x="62" y="148">初始状态</text><text class="dg-ts" x="62" y="166">TODO 说明</text>
</g>
<g data-step="1" data-flow="1"><path class="dg-line" d="M102,92 H170" marker-end="url(#m9)"/></g>
<!-- 步骤 1：第一步变换。追踪格原地不动、颜色变深示意 -->
<g class="dg-pop" data-step="1">
<rect class="dg-cell" x="174" y="56" width="72" height="72" rx="3"/>
<rect class="dg-cell-p" x="174" y="56" width="18" height="18"/><rect class="dg-cell-p" x="174" y="74" width="18" height="18"/><rect class="dg-cell-p" x="174" y="92" width="18" height="18"/><rect class="dg-cell-p" x="174" y="110" width="18" height="18"/>
<path class="dg-cell" d="M192,56 V128 M210,56 V128 M228,56 V128 M174,74 H246 M174,92 H246 M174,110 H246"/>
<text class="dg-tl" x="136" y="78">步骤一</text><text class="dg-ts" x="136" y="110">TODO</text>
<text class="dg-tb" x="210" y="148">变换后</text><text class="dg-ts" x="210" y="166">TODO 说明</text>
</g>
<g data-step="2" data-flow="1"><path class="dg-line" d="M250,92 H318" marker-end="url(#m9)"/></g>
<!-- 步骤 2：第二步变换。追踪格被搬动（每行左移递增） -->
<g class="dg-pop" data-step="2">
<rect class="dg-cell" x="322" y="56" width="72" height="72" rx="3"/>
<rect class="dg-cell-p" x="322" y="56" width="18" height="18"/><rect class="dg-cell-p" x="376" y="74" width="18" height="18"/><rect class="dg-cell-p" x="358" y="92" width="18" height="18"/><rect class="dg-cell-p" x="340" y="110" width="18" height="18"/>
<path class="dg-cell" d="M340,56 V128 M358,56 V128 M376,56 V128 M322,74 H394 M322,92 H394 M322,110 H394"/>
<text class="dg-tl" x="284" y="78">步骤二</text><text class="dg-ts" x="284" y="110">TODO</text>
<text class="dg-tb" x="358" y="148">移位后</text><text class="dg-ts" x="358" y="166">TODO 说明</text>
</g>
<g data-step="3" data-flow="1"><path class="dg-line" d="M398,92 H466" marker-end="url(#m9)"/></g>
<!-- 步骤 3：输出。整块换色表示已混合 -->
<g class="dg-pop" data-step="3">
<rect class="dg-cell-x" x="470" y="56" width="72" height="72" rx="3"/>
<rect class="dg-cell" x="470" y="56" width="72" height="72" rx="3"/>
<path class="dg-cell" d="M488,56 V128 M506,56 V128 M524,56 V128 M470,74 H542 M470,92 H542 M470,110 H542"/>
<text class="dg-tl" x="432" y="78">步骤三</text><text class="dg-ts" x="432" y="110">TODO</text>
<text class="dg-tb" x="506" y="148">输出结果</text><text class="dg-ts" x="506" y="166">TODO 说明</text>
</g>
</svg>
<figcaption>图 N：TODO 概括这张图讲了什么。点上面的「播放」可以看数据是怎么被一步步搬动的。</figcaption>
</figure>
